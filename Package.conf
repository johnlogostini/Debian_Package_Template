###############################################################################
# Debian Package Template Configuration
# Version: 1.0.0
###############################################################################

###############################################################################
# Package Information
###############################################################################

PACKAGE_NAME="debian-package-template"
DISPLAY_NAME="Debian Package Template"
VERSION="1.0.0"
RELEASE="1"

###############################################################################
# Debian Package
###############################################################################

ARCHITECTURE="amd64"
SECTION="devel"
PRIORITY="optional"

###############################################################################
# Maintainer
###############################################################################

MAINTAINER_NAME="JohnLogostini"
MAINTAINER_EMAIL="johnlogostini16485@gmail.com"

###############################################################################
# Project Information
###############################################################################

VENDOR="JohnLogostini"
LICENSE="MIT"
HOMEPAGE="https://github.com/johnlogostini/Debian_Package_Template"
BUG_REPORTS="https://github.com/johnlogostini/Debian_Package_Template/issues"
REPOSITORY="https://github.com/johnlogostini/Debian_Package_Template"

###############################################################################
# Description
###############################################################################

SUMMARY="A reusable Debian package template."

DESCRIPTION="Debian Package Template is a reusable foundation for creating professional Debian packages with desktop integration, AppStream metadata, MIME associations, SVG icons, localization, and example project files."

###############################################################################
# Application
###############################################################################

INSTALL_DIRECTORY="/usr/lib/debian-package-template"
REAL_EXECUTABLE="dpt"
WRAPPER_NAME="debian-package-template"

###############################################################################
# Desktop Entry
###############################################################################

DESKTOP_ID="debian-package-template.desktop"
GENERIC_NAME="Debian Package Builder"
COMMENT="Create professional Debian packages."
CATEGORIES="Development;"
KEYWORDS="Debian;Package;Builder;Development;"
TERMINAL="false"
STARTUP_NOTIFY="true"
STARTUP_WM_CLASS="zenity"

###############################################################################
# File Association
###############################################################################

FILE_EXTENSION="dptf"
FILE_TYPE_NAME="Debian Package Template File"
MIME_TYPE="application/x-debian-package-template-file"

###############################################################################
# Icons
###############################################################################

APPLICATION_ICON="debian-package-template"
FILE_ICON="debian-package-template-file"

###############################################################################
# AppStream
###############################################################################

APPSTREAM_ID="io.github.johnlogostini.Debian_Package_Template"
METADATA_LICENSE="FSFAP"
PROJECT_LICENSE="MIT"
CONTENT_RATING="oars-1.1"
DEVELOPER_ID="io.github.johnlogostini"
DEVELOPER_NAME="JohnLogostini"

###############################################################################
# Screenshots
###############################################################################

SCREENSHOT_DIRECTORY="Screenshots"
SCREENSHOT_01="Screenshot_01.png"
SCREENSHOT_02="Screenshot_02.png"
SCREENSHOT_03="Screenshot_03.png"

###############################################################################
# Example Project
###############################################################################

EXAMPLES_DIRECTORY="Examples"
EXAMPLE_FILE="Debian Package Template File.dptf"

###############################################################################
# Dependencies
###############################################################################

DEPENDENCIES="libc6"
RECOMMENDS=""
SUGGESTS=""

###############################################################################
# Build Output
###############################################################################

BUILD_DIRECTORY="Build"
TEMP_DIRECTORY="Build/.temp"
OUTPUT_FILE="${PACKAGE_NAME}_${VERSION}_${ARCHITECTURE}.deb"

###############################################################################
# Repository Files
###############################################################################

CONTROL_FILE="DEBIAN/control"
POST_INSTALL="DEBIAN/postinst"
PRE_REMOVE="DEBIAN/prerm"
POST_REMOVE="DEBIAN/postrm"

###############################################################################
# Installed Files
###############################################################################

DESKTOP_FILE="usr/share/applications/debian-package-template.desktop"
APPSTREAM_FILE="usr/share/metainfo/io.github.johnlogostini.Debian_Package_Template.metainfo.xml"
MIME_FILE="usr/share/mime/packages/debian-package-template-file.xml"
APP_ICON="usr/share/icons/hicolor/scalable/apps/debian-package-template.svg"
MIME_ICON="usr/share/icons/hicolor/scalable/mimetypes/debian-package-template-file.svg"
WRAPPER_SCRIPT="usr/bin/debian-package-template"
APPLICATION_DIRECTORY="usr/lib/debian-package-template"

###############################################################################
# Documentation
###############################################################################

MAN_PAGE="usr/share/man/man1/debian-package-template.1"
CHANGELOG="usr/share/doc/debian-package-template/changelog"
COPYRIGHT_FILE="usr/share/doc/debian-package-template/copyright"

###############################################################################
# Validation
###############################################################################

REQUIRE_DESKTOP_FILE="true"
REQUIRE_APPSTREAM="true"
REQUIRE_MIME="true"
REQUIRE_APP_ICON="true"
REQUIRE_MIME_ICON="true"
REQUIRE_SCREENSHOTS="true"
REQUIRE_MAN_PAGE="true"

###############################################################################
# Build Tools
###############################################################################

BUILD_TOOLS="dpkg-deb lintian desktop-file-validate appstreamcli update-mime-database"

###############################################################################
# Logging
###############################################################################

VERBOSE="true"
COLOR_OUTPUT="true"

###############################################################################
# End of Configuration
###############################################################################
